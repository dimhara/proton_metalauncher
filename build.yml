name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Install MinGW cross compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64

      - name: Install Windows Rust target
        run: rustup target add x86_64-pc-windows-gnu

      # No actions/checkout: fetch the exact ref with plain git instead.
      - name: Fetch source
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -q .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git" 2>/dev/null || \
            git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          # Strip base64's line wrapping: a newline inside an HTTP header
          # makes libcurl fail with "a bad argument".
          auth="$(printf 'x-access-token:%s' "${GITHUB_TOKEN}" | base64 | tr -d '\n')"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" \
            fetch -q --depth 1 origin "${GITHUB_REF}"
          git checkout -q FETCH_HEAD

      - name: Test host-side logic
        run: cargo test --quiet

      - name: Build launcher.exe
        run: |
          cargo build --release --target x86_64-pc-windows-gnu
          cp target/x86_64-pc-windows-gnu/release/launcher.exe launcher.exe
          x86_64-w64-mingw32-strip launcher.exe
          sha256sum launcher.exe > launcher.exe.sha256
          ls -l launcher.exe

      # One rolling release, overwritten on every non-PR build, so the
      # download link is always the latest binary.
      - name: Publish latest release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view latest >/dev/null 2>&1 || \
            gh release create latest \
              --title "Latest build" \
              --notes "Automated build of ${GITHUB_SHA}" \
              --target "${GITHUB_SHA}"
          gh release edit latest --notes "Automated build of ${GITHUB_SHA}"
          gh release upload latest launcher.exe launcher.exe.sha256 --clobber
